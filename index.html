<script>
    let currentToken = "";
    let isUserAuthenticated = false;
    let currentSession = "";

    window.addEventListener('DOMContentLoaded', () => {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionParam = urlParams.get('session');

            const badge = document.getElementById('statusBadge');
            const genBtn = document.getElementById('genBtn');
            const warningBox = document.getElementById('unauthWarning');

            if (sessionParam) {
                currentSession = sessionParam;
                isUserAuthenticated = true; 
                badge.innerText = "AUTHENTICATED (READY)";
                badge.className = "badge badge-success";
                genBtn.disabled = false;
                warningBox.style.display = "none";
            } else {
                isUserAuthenticated = false;
                badge.innerText = "UNAUTHENTICATED (BLOCKED)";
                badge.className = "badge badge-error";
                genBtn.disabled = true;
                genBtn.innerText = "🔒 KHÓA - VUI LÒNG VƯỢT LINK ĐỂ MỞ";
                genBtn.classList.add('disabled');
                warningBox.style.display = "block";
            }
        } catch (e) {
            console.error("Lỗi chạy script:", e);
        }
    });

    async function generateToken() {
        if (!isUserAuthenticated || !currentSession) {
            alert("Bạn chưa vượt link hợp lệ!");
            return;
        }

        const genBtn = document.getElementById('genBtn');
        genBtn.disabled = true;
        genBtn.innerText = "ĐANG TẠO KEY...";

        try {
            const response = await fetch(`/api/generate?session=${currentSession}`);
            const data = await response.json();

            if (data && data.success) {
                currentToken = data.key;
                const display = document.getElementById('keyDisplay');
                const copyBtn = document.getElementById('copyBtn');

                display.style.display = 'block';
                display.innerText = currentToken;
                copyBtn.style.display = 'block';
                genBtn.innerText = "✅ ĐÃ TẠO KEY THÀNH CÔNG";
            } else {
                alert("Lỗi: " + (data.message || "Không thể tạo Key!"));
                genBtn.disabled = false;
                genBtn.innerText = "NHẬN KEY FREE (24H)";
            }
        } catch (error) {
            console.error(error);
            alert("Lỗi kết nối API!");
            genBtn.disabled = false;
            genBtn.innerText = "NHẬN KEY FREE (24H)";
        }
    }

    function copyToken() {
        if (!currentToken) return;
        navigator.clipboard.writeText(currentToken).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "✅ ĐÃ SAO CHÉP KEY!";
            btn.style.background = "#e67e22";
            setTimeout(() => {
                btn.innerText = "SAO CHÉP KEY";
                btn.style.background = "#2ecc71";
            }, 2000);
        });
    }
</script>
